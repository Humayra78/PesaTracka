<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PesaTracka Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-value { font-size: 2rem; font-weight: bold; color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">💰 PesaTracka Insights</h1>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>Total Earnings</h5>
                    <div id="total-earnings" class="stat-value">KES 0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>Transactions</h5>
                    <div id="txn-count" class="stat-value">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center text-primary">
                    <h5>Next Day Forecast</h5>
                    <div id="forecast" class="stat-value" style="color: #3498db;">KES 0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch data from your Flask API
        fetch('/api/dashboard')
            .then(response => response.json())
            .then(data => {
                document.getElementById('total-earnings').innerText = 'KES ' + data.total_earnings.toLocaleString();
                document.getElementById('txn-count').innerText = data.transaction_count;
                document.getElementById('forecast').innerText = 'KES ' + data.next_month_forecast.toLocaleString();
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
